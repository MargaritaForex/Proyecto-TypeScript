<!DOCTYPE html>
<html>
<head>
  <meta charset='utf-8'>
  <meta http-equiv='X-UA-Compatible' content='IE=edge'>
  <title>Taller TypeScript</title>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="tallertypescript.css">
  <script type="module" src='./scripts/main.js'></script>
  <style>
    table {
      margin-top: 20px;
      border-collapse: collapse;
      width: 100%;
      max-width: 600px;
    }
    td {
      padding: 8px;
      border: 1px solid #ddd;
      text-align: left;
    }
    td:first-child {
      font-weight: bold;
      width: 30%;
    }
    img {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <h1>Taller TypeScript</h1>
  
  <div class="main-container">
    <div class="info-container">
      <table id="aprendiz"></table>
      <table id="estadisticas">
        <thead>
          <tr>
            <th colspan="2">Estadísticas</th>
          </tr>
        </thead>
      </table>
    </div>
    
    <div class="cursos-container">
      <div class="filtro-container">
        <input type="text" id="texto-busqueda" placeholder="Buscar curso...">
        <button id="boton-filtro">Buscar</button>
      </div>
      
      <table id="cursos">
        <thead>
          <tr>
            <th>Nombre del curso</th>
            <th>Horas</th>
            <th>Calificación</th>
            <th>Certificado</th>
            <th>Año</th>
          </tr>
        </thead>
      </table>
    </div>
  </div>
</body>
</html>
