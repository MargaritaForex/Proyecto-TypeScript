<!DOCTYPE html>
<html>
<head>
  <meta charset='utf-8'>
  <meta http-equiv='X-UA-Compatible' content='IE=edge'>
  <title>Proyecto TypeScript</title>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <link rel="icon" href="data:,">
  <script type="module" src='./scripts/main.js'></script>
  <style>
    table {
      margin-top: 20px;
      border-collapse: collapse;
      width: 100%;
      max-width: 600px;
    }
    td {
      padding: 8px;
      border: 1px solid #ddd;
      text-align: left;
    }
    td:first-child {
      font-weight: bold;
      width: 30%;
    }
    img {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <h1>Taller TypeScript</h1>
  <table id="aprendiz"></table>
  <h2>Estadisticas</h2>
  <table id="estadisticas"></table> 
  <h2>Cursos tomados</h2>
  <input type="text" class="form-control" id="texto-busqueda" placeholder="Filtrar por nombre">
  <button type="button" id="boton-filtro" class="btn btn-sucess">Aplicar</button>
  <table id="cursos">
    <thead class="thead-dark">
      <tr>
        <th>Nombre</th>
        <th>Horas</th>
        <th>Calificación</th>
        <th>Certificado</th>
        <th>Año</th>
      </tr>
    </thead>
  </table>
</body>
</html>
